services:
  stockflow-api:
    build: { context: ./backend, dockerfile: ../docker/api.Dockerfile }
    environment: { ASPNETCORE_URLS: http://+:8080, ConnectionStrings__Database: "Host=host.docker.internal;Port=5432;Database=stockflow;Username=postgres;Password=postgres;Pooling=true", WebOrigin: "http://localhost:5173", PasswordReset__ExposeResetToken: "true" }
    ports: ["8080:8080"]
  stockflow-worker:
    build: { context: ./backend, dockerfile: ../docker/worker.Dockerfile }
    environment: { ConnectionStrings__Database: "Host=host.docker.internal;Port=5432;Database=stockflow;Username=postgres;Password=postgres;Pooling=true", ReportStorage: /app/reports }
    volumes: [stockflow_reports:/app/reports]
  stockflow-web:
    build: { context: ./frontend/stockflow-web, dockerfile: ../../docker/web.Dockerfile }
    ports: ["5173:80"]
    depends_on: [stockflow-api]
volumes: { stockflow_reports: {} }
