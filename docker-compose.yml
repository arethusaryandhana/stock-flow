services:
  stockflow-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [stockflow_db:/var/lib/postgresql/data]
  stockflow-api:
    build: { context: ./backend, dockerfile: ../docker/api.Dockerfile }
    environment: { ASPNETCORE_ENVIRONMENT: Development, ASPNETCORE_URLS: http://+:8080, ConnectionStrings__Database: "Host=stockflow-db;Port=5432;Database=stockflow;Username=postgres;Password=postgres;Pooling=true", WebOrigin: "http://localhost:5173" }
    ports: ["8080:8080"]
    depends_on:
      stockflow-db: { condition: service_healthy }
  stockflow-worker:
    build: { context: ./backend, dockerfile: ../docker/worker.Dockerfile }
    environment: { ConnectionStrings__Database: "Host=stockflow-db;Port=5432;Database=stockflow;Username=postgres;Password=postgres;Pooling=true", ReportStorage: /app/reports }
    volumes: [stockflow_reports:/app/reports]
    depends_on:
      stockflow-db: { condition: service_healthy }
  stockflow-web:
    build: { context: ./frontend/stockflow-web, dockerfile: ../../docker/web.Dockerfile }
    ports: ["5173:80"]
    depends_on: [stockflow-api]
volumes: { stockflow_db: {}, stockflow_reports: {} }
